<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS 1.6 Sunucu Rehberi & Değerlendirme</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        header { text-align: center; padding: 30px; border-bottom: 1px solid var(--border-color); margin-bottom: 30px; }
        header h1 { color: var(--accent-color); }
        .container { max-width: 800px; margin: 0 auto; }
        .server-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .ip-badge { background: var(--bg-color); color: var(--accent-color); padding: 6px 12px; border-radius: 6px; font-family: monospace; border: 1px solid var(--border-color); }
        .btn { background: var(--accent-color); color: var(--bg-color); border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: var(--accent-hover); }
        
        .comment-form { background: #0f172a; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid var(--border-color); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.9rem; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px; background: #1e293b; border: 1px solid var(--border-color); color: #fff; border-radius: 6px;
        }
        .comments-list { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .comment-item { background: #0f172a; padding: 12px; border-radius: 6px; border-left: 3px solid var(--accent-color); }
        .comment-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
        .stars { color: #facc15; }
        .error-msg { color: #ef4444; font-size: 0.9rem; margin-top: 10px; }
        .success-msg { color: #22c55e; font-size: 0.9rem; margin-top: 10px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <header>
        <h1>CS 1.6 Sunucu Rehberi</h1>
        <p>Topluluk Tarafından Değerlendirilen En İyi Sunucular</p>
    </header>

    <div class="container">
        <div class="server-card">
            <h2>Invicta Virtus Pro</h2>
            <p style="color: var(--text-muted); margin-bottom: 10px;">Pro Publica | Status: Online 🟢</p>
            <span class="ip-badge">connect 193.111.76.3:27015</span>
            
            <hr style="border-color: var(--border-color); margin: 20px 0;">

            <h3>Ortalama Puan: <span id="avg-score" style="color: #facc15;">⭐ 5.0</span> (<span id="total-count">0</span> Oy)</h3>

            <div class="comment-form">
                <h4>Yorum Yap & Oy Ver</h4>
                <div id="form-container">
                    <div class="form-group">
                        <label>Rumuz (Nick):</label>
                        <input type="text" id="nick" placeholder="Oyundaki Nickiniz" maxlength="20">
                    </div>
                    <div class="form-group">
                        <label>Puanınız:</label>
                        <select id="score">
                            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                            <option value="4">⭐⭐⭐⭐ (4/5)</option>
                            <option value="3">⭐⭐⭐ (3/5)</option>
                            <option value="2">⭐⭐ (2/5)</option>
                            <option value="1">⭐ (1/5)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Yorumunuz:</label>
                        <textarea id="comment" rows="3" placeholder="Sunucu hakkında ne düşünüyorsunuz?"></textarea>
                    </div>
                    <button class="btn" onclick="submitComment()">Yorum Gönder</button>
                    <div id="msg"></div>
                </div>
            </div>

            <h4 style="margin-top: 30px;">Son Yorumlar</h4>
            <div class="comments-list" id="comments-list">
                <p style="color: var(--text-muted);">Yorumlar yükleniyor...</p>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://csoyla-admin-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let userIp = "";

        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => { userIp = data.ip; checkUserBanAndVote(); });

        function checkUserBanAndVote() {
            if(!userIp) return;
            const cleanIp = userIp.replace(/\./g, "_");

            db.ref('banned_ips/' + cleanIp).once('value', snapshot => {
                if(snapshot.exists()) {
                    document.getElementById('form-container').innerHTML = `<p class="error-msg">⛔ Bu IP adresinden yorum yapılması engellenmiştir.</p>`;
                } else {
                    db.ref('user_votes/' + cleanIp).once('value', voteSnap => {
                        if(voteSnap.exists()) {
                            document.getElementById('form-container').innerHTML = `<p class="success-msg">✓ Bu sunucuya zaten oy verdiniz. Her IP sadece 1 kez oy kullanabilir.</p>`;
                        }
                    });
                }
            });
        }

        function submitComment() {
            const nick = document.getElementById('nick').value.trim();
            const score = parseInt(document.getElementById('score').value);
            const comment = document.getElementById('comment').value.trim();
            const msgEl = document.getElementById('msg');

            if(!nick || !comment) {
                msgEl.className = 'error-msg';
                msgEl.innerText = 'Lütfen rumuz ve yorum alanlarını doldurun.';
                return;
            }

            if(!userIp) {
                msgEl.className = 'error-msg';
                msgEl.innerText = 'IP adresiniz doğrulanamadı, lütfen sayfayı yenileyin.';
                return;
            }

            const cleanIp = userIp.replace(/\./g, "_");

            const newCommentRef = db.ref('comments').push();
            newCommentRef.set({
                nick: nick,
                score: score,
                comment: comment,
                ip: userIp,
                timestamp: Date.now()
            }).then(() => {
                db.ref('user_votes/' + cleanIp).set(true);
                msgEl.className = 'success-msg';
                msgEl.innerText = 'Yorumunuz başarıyla yayınlandı!';
                setTimeout(() => location.reload(), 1500);
            });
        }

        db.ref('comments').on('value', snapshot => {
            const listEl = document.getElementById('comments-list');
            listEl.innerHTML = '';
            
            let total = 0;
            let count = 0;

            if(!snapshot.exists()) {
                listEl.innerHTML = '<p style="color: var(--text-muted);">Henüz yorum yapılmamış.</p>';
                return;
            }

            snapshot.forEach(child => {
                const data = child.val();
                total += data.score;
                count++;

                const stars = '⭐'.repeat(data.score);
                const item = document.createElement('div');
                item.className = 'comment-item';
                item.innerHTML = `
                    <div class="comment-header">
                        <span>${escapeHtml(data.nick)}</span>
                        <span class="stars">${stars}</span>
                    </div>
                    <div>${escapeHtml(data.comment)}</div>
                `;
                listEl.appendChild(item);
            });

            document.getElementById('avg-score').innerText = `⭐ ${(total / count).toFixed(1)}`;
            document.getElementById('total-count').innerText = count;
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>

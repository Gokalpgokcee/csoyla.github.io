<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gelişmiş Admin Paneli</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 20px; }
        .login-box { max-width: 320px; margin: 100px auto; background: #1e293b; padding: 25px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #38bdf8; border: none; padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; color: #0f172a; }
        
        .section { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #334155; }
        .section h3 { margin-bottom: 15px; color: #38bdf8; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        table th, table td { border: 1px solid #334155; padding: 10px; text-align: left; font-size: 0.9rem; }
        table th { background: #0f172a; }

        .btn-approve { background: #22c55e; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-delete { background: #ef4444; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-ban { background: #f97316; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <div id="login-screen" class="login-box">
        <h3>Admin Paneli Girişi</h3>
        <input type="password" id="admin-pass" placeholder="Şifre">
        <button onclick="login()">Giriş Yap</button>
        <p id="error" style="color:#ef4444; margin-top:10px; font-size:0.85rem;"></p>
    </div>

    <div id="admin-panel" style="display:none; max-width: 1000px; margin: 0 auto;">
        
        <!-- Onay Bekleyen Sunucular -->
        <div class="section">
            <h3>⏳ Onay Bekleyen Sunucular</h3>
            <table>
                <thead>
                    <tr>
                        <th>Sunucu Adı</th>
                        <th>Mod</th>
                        <th>IP</th>
                        <th>Ekleyen</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="pending-servers-list"></tbody>
            </table>
        </div>

        <!-- Onaylanmış Sunucular Yönetimi -->
        <div class="section">
            <h3>🟢 Yayınlanan Sunucular</h3>
            <table>
                <thead>
                    <tr>
                        <th>Sunucu Adı</th>
                        <th>IP</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="approved-servers-list"></tbody>
            </table>
        </div>

        <!-- Banlı IP Yönetimi -->
        <div class="section">
            <h3>🚫 Banlı IP Adresleri</h3>
            <table>
                <thead>
                    <tr>
                        <th>IP Adresi</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="banned-ips-list"></tbody>
            </table>
        </div>

    </div>

    <script>
        const ADMIN_PASSWORD = "admin"; // Şifrenizi buradan değiştirebilirsiniz

        const firebaseConfig = {
            databaseURL: "https://csoyla-admin-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function login() {
            if(document.getElementById('admin-pass').value === ADMIN_PASSWORD) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadAdminData();
            } else {
                document.getElementById('error').innerText = 'Hatalı Şifre!';
            }
        }

        function loadAdminData() {
            // Onay Bekleyen Sunucuları Yükle
            db.ref('pending_servers').on('value', snapshot => {
                const list = document.getElementById('pending-servers-list');
                list.innerHTML = '';
                if(!snapshot.exists()) { list.innerHTML = '<tr><td colspan="5">Onay bekleyen sunucu yok.</td></tr>'; return; }

                snapshot.forEach(child => {
                    const id = child.key;
                    const data = child.val();
                    list.innerHTML += `
                        <tr>
                            <td>${data.name}</td>
                            <td>${data.mod}</td>
                            <td><code>${data.ip}</code></td>
                            <td>${data.addedBy}</td>
                            <td>
                                <button class="btn-approve" onclick="approveServer('${id}')">Onayla</button>
                                <button class="btn-delete" onclick="rejectServer('${id}')">Reddet</button>
                            </td>
                        </tr>
                    `;
                });
            });

            // Onaylanmış Sunucuları Yükle
            db.ref('approved_servers').on('value', snapshot => {
                const list = document.getElementById('approved-servers-list');
                list.innerHTML = '';
                if(!snapshot.exists()) { list.innerHTML = '<tr><td colspan="3">Yayınlanan sunucu yok.</td></tr>'; return; }

                snapshot.forEach(child => {
                    const id = child.key;
                    const data = child.val();
                    list.innerHTML += `
                        <tr>
                            <td>${data.name}</td>
                            <td><code>${data.ip}</code></td>
                            <td>
                                <button class="btn-delete" onclick="deleteApprovedServer('${id}')">Siteden Kaldır</button>
                            </td>
                        </tr>
                    `;
                });
            });

            // Banlı IP'leri Yükle
            db.ref('banned_ips').on('value', snapshot => {
                const list = document.getElementById('banned-ips-list');
                list.innerHTML = '';
                if(!snapshot.exists()) { list.innerHTML = '<tr><td colspan="2">Banlı IP yok.</td></tr>'; return; }

                snapshot.forEach(child => {
                    const cleanIp = child.key;
                    const originalIp = cleanIp.replace(/_/g, ".");
                    list.innerHTML += `
                        <tr>
                            <td><code>${originalIp}</code></td>
                            <td>
                                <button class="btn-approve" onclick="unbanIp('${cleanIp}')">Banı Kaldır</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        // Sunucuyu Onayla
        function approveServer(id) {
            db.ref('pending_servers/' + id).once('value', snap => {
                if(snap.exists()) {
                    const srvData = snap.val();
                    db.ref('approved_servers').push(srvData).then(() => {
                        db.ref('pending_servers/' + id).remove();
                    });
                }
            });
        }

        // Sunucu Reddet / Sil
        function rejectServer(id) {
            if(confirm('Bu sunucu başvurusunu reddetmek istiyor musunuz?')) {
                db.ref('pending_servers/' + id).remove();
            }
        }

        function deleteApprovedServer(id) {
            if(confirm('Sunucuyu yayın akışından kaldırmak istediğinize emin misiniz?')) {
                db.ref('approved_servers/' + id).remove();
                db.ref('comments/' + id).remove();
            }
        }

        // Ban Kaldır
        function unbanIp(cleanIp) {
            db.ref('banned_ips/' + cleanIp).remove();
        }
    </script>
</body>
</html>
